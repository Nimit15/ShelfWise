<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161310"/>
      <stop offset="100%" style="stop-color:#F87171"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7F4EF"/>
      <stop offset="100%" style="stop-color:#E5C185"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="420" fill="url(#grad1)"/>

  <!-- Ivory left accent -->
  <rect x="0" y="0" width="300" height="420" fill="url(#grad2)"/>

  <!-- Main content -->
  <g transform="translate(400, 210)">
    <!-- ShelfWise Atelier title -->
    <text x="0" y="-180" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="#F7F4EF" text-anchor="middle">ShelfWise Atelier</text>

    <!-- Subtitle -->
    <text x="0" y="-130" font-family="Inter, system-ui, sans-serif" font-size="32" fill="#F87171" text-anchor="middle">16-Channel YouCam V2.1 Biometric Telemetry & Bio-Inventory Conflict Engine</text>

    <!-- Pipeline pills -->
    <g transform="translate(0, 80)">
      <g stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="-200" y1="-12" x2="-150" y1="-12"/>
        <text x="-140" y="-5" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#34D399" text-anchor="middle">01 Optical Scan</text>

        <line x1="-60" y1="-12" x2="-10" y1="-12"/>
        <text x="-5" y="-5" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#34D399" text-anchor="middle">02 Skin-Type Calibration</text>

        <line x1="80" y1="-12" x2="130" y1="-12"/>
        <text x="120" y="-5" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#34D399" text-anchor="middle">03 Reference Formulations</text>

        <line x1="220" y1="-12" x2="270" y1="-12"/>
        <text x="260" y="-5" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#34D399" text-anchor="middle">04 Shelf Conflict Ledger</text>
      </g>
    </g>
  </g>
</svg>