<svg width="1200" height="470" viewBox="0 0 1200 470" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arch-bg" x1="0" y1="0" x2="1200" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#211C18"/>
      <stop offset="1" stop-color="#100E0C"/>
    </linearGradient>
    <marker id="arch-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9" fill="#E5C185"/>
    </marker>
    <style>
      .head { font: 600 19px Arial, sans-serif; fill: #F7F4EF; text-anchor: middle; }
      .body { font: 14px Arial, sans-serif; fill: #C4BDB3; text-anchor: middle; }
      .number { font: 700 13px ui-monospace, monospace; fill: #E5C185; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="470" rx="24" fill="url(#arch-bg)"/>
  <text x="600" y="62" text-anchor="middle" fill="#E5C185" font-family="ui-monospace, monospace" font-size="14" letter-spacing="3">SHELFWISE · SYSTEM FLOW</text>

  <g stroke="#E5C185" stroke-opacity=".5" fill="#2B241E" stroke-width="1.5">
    <rect x="42" y="142" width="244" height="210" rx="18"/>
    <rect x="326" y="142" width="244" height="210" rx="18"/>
    <rect x="610" y="142" width="244" height="210" rx="18"/>
    <rect x="894" y="142" width="264" height="210" rx="18"/>
  </g>

  <g>
    <text x="164" y="178" class="number">01 · INPUT</text>
    <text x="164" y="218" class="head">Selfie &amp; Profile</text>
    <text x="164" y="253" class="body">JPEG / PNG · under 10 MB</text>
    <text x="164" y="278" class="body">HD short side ≥1080 px</text>
    <text x="164" y="303" class="body">SD short side ≥480 px</text>

    <text x="448" y="178" class="number">02 · ANALYSIS</text>
    <text x="448" y="218" class="head">YouCam V2.1</text>
    <text x="448" y="253" class="body">File upload &amp; task polling</text>
    <text x="448" y="278" class="body">16 HD or 16 SD actions</text>
    <text x="448" y="303" class="body">Concern scores &amp; mask URLs</text>

    <text x="732" y="178" class="number">03 · ENGINE</text>
    <text x="732" y="218" class="head">Bio-Inventory</text>
    <text x="732" y="253" class="body">Skin profile &amp; barrier rules</text>
    <text x="732" y="278" class="body">INCI, actives &amp; texture fit</text>
    <text x="732" y="303" class="body">Conflicts &amp; role redundancy</text>

    <text x="1026" y="178" class="number">04 · DECISION</text>
    <text x="1026" y="218" class="head">Routine &amp; Verdict</text>
    <text x="1026" y="253" class="body">Keep · Pause · Reference</text>
    <text x="1026" y="278" class="body">AM / PM · Budget-aware gaps</text>
    <text x="1026" y="303" class="body">Buy Nothing · ₹0 Needed</text>
  </g>

  <g stroke="#E5C185" stroke-width="2" marker-end="url(#arch-arrow)">
    <line x1="286" y1="247" x2="316" y2="247"/>
    <line x1="570" y1="247" x2="600" y2="247"/>
    <line x1="854" y1="247" x2="884" y2="247"/>
  </g>

  <text x="600" y="410" text-anchor="middle" fill="#8A8177" font-family="Arial, sans-serif" font-size="14">Live scans require a Perfect Corp API key; demo mode uses a clearly labeled deterministic sample fixture.</text>
</svg>
