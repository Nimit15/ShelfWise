<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161310"/>
      <stop offset="100%" style="stop-color:#F87171"/>
    </linearGradient>
    <style>
      .label { font-family: Inter, system-ui, sans-serif; font-size: 18px; fill: #F7F4EF; text-anchor: middle; }
      .sub { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: #E5C185; text-anchor: middle; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg)"/>

  <!-- Group style: white cards -->
  <g fill="#F7F4EF" stroke="#34D399" stroke-width="2">
    <!-- Column 1: Client Pre-Flight Validator -->
    <g transform="translate(100, 160)">
      <rect x="0" y="0" width="280" height="200" rx="12"/>
      <text x="140" y="40" class="label" font-weight="bold">Client Pre-Flight Validator</text>
      <text x="140" y="70" class="sub">320px–4096px</text>
      <text x="140" y="90" class="sub">MIME/size check</text>
    </g>

    <!-- Column 2: Next.js Route Handler -->
    <g transform="translate(460, 160)">
      <rect x="0" y="0" width="280" height="200" rx="12"/>
      <text x="140" y="40" class="label" font-weight="bold">Next.js 16 Route Handler</text>
      <text x="140" y="70" class="sub">/api/youcam/scan</text>
      <text x="140" y="90" class="sub">SHA-256 Dedup Cache</text>
      <text x="140" y="110" class="sub">Rate Limiter</text>
    </g>

    <!-- Column 3: YouCam V2.1 Pipeline -->
    <g transform="translate(820, 160)">
      <rect x="0" y="0" width="280" height="200" rx="12"/>
      <text x="140" y="40" class="label" font-weight="bold">Perfect Corp. YouCam V2.1 Pipeline</text>
      <text x="140" y="70" class="sub">POST /s2s/v2.0/file</text>
      <text x="140" y="90" class="sub">POST /s2s/v2.1/task/skin-analysis</text>
      <text x="140" y="110" class="sub">Status Polling</text>
    </g>

    <!-- Column 4: Bio-Inventory Engine -->
    <g transform="translate(1180, 160)">
      <rect x="0" y="0" width="280" height="200" rx="12"/>
      <text x="140" y="40" class="label" font-weight="bold">Deterministic Bio-Inventory Engine</text>
      <text x="140" y="70" class="sub">skin-type-resolver.ts</text>
      <text x="140" y="90" class="sub">zone-mapper.ts</text>
      <text x="140" y="110" class="sub">inci-parser.ts</text>
      <text x="140" y="130" class="sub">optimizer.ts</text>
    </g>
  </g>

  <!-- Arrows between columns -->
  <g stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#34D399"/>
      </marker>
    </defs>
    <line x1="380" y1="260" x2="460" y2="260"/>
    <line x1="740" y1="260" x2="820" y2="260"/>
    <line x1="1100" y1="260" x2="1180" y2="260"/>
  </g>
</svg>